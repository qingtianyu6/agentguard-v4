components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AgentGuardKey:
      type: apiKey
      in: header
      name: X-AgentGuard-Key
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    Decision:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ALLOW
          - ASK
          - REPAIR
          - DENY
        decision_id:
          type: string
        action_id:
          type: string
        risk_level:
          type: string
        matched_contracts:
          type: array
          items:
            type: string
        required_conditions:
          type: array
          items:
            type: string
        latency_ms:
          type: integer
    ActionPreflightRequest:
      type: object
      required:
      - session_id
      - agent_id
      - tool_call
      properties:
        session_id:
          type: string
        agent_id:
          type: string
        tool_call:
          $ref: '#/components/schemas/GenericObject'
        resource_refs:
          type: array
          items:
            type: string
        declared_destination:
          type: string
        client_context:
          $ref: '#/components/schemas/GenericObject'
    ActionResultRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
        result_ref:
          type: string
        result_summary:
          $ref: '#/components/schemas/GenericObject'
        duration_ms:
          type: integer
    PolicyCreate:
      type: object
      required:
      - name
      - natural_language
      properties:
        name:
          type: string
        natural_language:
          type: string
        tags:
          type: array
          items:
            type: string
    RecoveryPlanRequest:
      type: object
      required:
      - action_id
      properties:
        action_id:
          type: string
        max_action_distance:
          type: number
        require_human_approval:
          type: boolean
x-realtime:
- /ws/v1/runtime
- /ws/v1/trajectories/{trace_id}
- /ws/v1/attack-lab/runs/{run_id}
- /ws/v1/experiments/runs/{run_id}
- /api/v1/compilations/{job_id}/events
